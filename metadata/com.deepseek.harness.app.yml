    subdir: flutter/app
    submodules: yes
    output: flutter/app/build/app/outputs/flutter-apk/app-release.apk
    flutter: 3.47.1
    build:
      - cd ..
      - flutter pub get
      - cd app
      - flutter build apk --release --no-tree-shake-icons

