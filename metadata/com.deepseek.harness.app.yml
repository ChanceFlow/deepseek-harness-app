Categories:
  - Development
  - Internet
License: MIT
AuthorName: ChanceFlow
SourceCode: https://github.com/ChanceFlow/deepseek-harness-app
IssueTracker: https://github.com/ChanceFlow/deepseek-harness-app/issues
Changelog: https://github.com/ChanceFlow/deepseek-harness-app/releases

AutoName: DSH Mobile
Summary: Flutter client for DeepSeek Harness autonomous coding agent
Description: |-
  DSH Mobile is the official open-source Flutter client for DeepSeek Harness (dsh),
  an autonomous coding agent framework.

  Features:
  * Real-time Agent Monitoring: Track agent execution, tool invocations, bash commands, and multi-turn reasoning steps in real time.
  * Interactive Tool Approvals: Inspect and approve sandbox-restricted operations (file modifications, shell commands, web queries, and subagent forks) directly from your phone.
  * Seamless Backend Connectivity: Connect to your self-hosted or remote dsh web server over HTTP and WebSocket.
  * Goal & Session Management: Create, resume, pause, and inspect long-running autonomous development goals and multi-agent conversations.
  * Voice Input: On-device voice prompting with local speech recognition.
  * Modern UI: Built with Flutter and pure Material 3 design, supporting dynamic light and dark themes.
  * Free & Open Source: Licensed under MIT with no proprietary analytics or tracking SDKs.

AntiFeatures:
  - NonFreeNet

RepoType: git
Repo: https://github.com/ChanceFlow/deepseek-harness-app.git

Builds:
  - versionName: '0.1.2'
    versionCode: 102
    # The full commit hash of the v0.1.2 tag: fdroiddata's reference says not
    # to use a tag or branch name here. Resolve the current one with
    # `git rev-parse v<version>^{commit}`.
    commit: 0d53b2c7396653cc7fe4c022d05bc43a4cc2ff74
    subdir: flutter/app
    submodules: yes
    output: flutter/app/build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.1
    # Every Android build must pass cronetHttpNoPlay=true (embedded Cronet;
    # the play-services-cronet chain fails AGP 9's namespace check) and
    # DSH_TELEMETRY_ENABLED — false for this stable, telemetry-free channel.
    # --build-name/--build-number pin the built APK to this entry's
    # versionName/versionCode, which matters for tags cut before
    # flutter/app/pubspec.yaml gained its version: field.
    build:
      - cd ..
      - $$flutter$$/bin/flutter pub get
      - cd app
      - $$flutter$$/bin/flutter build apk --release --no-tree-shake-icons --dart-define=cronetHttpNoPlay=true --dart-define=DSH_TELEMETRY_ENABLED=false --dart-define=DSH_SOURCE_COMMIT=$$COMMIT$$ --dart-define=DSH_BUILD_NUMBER=$$VERCODE$$ --build-name=$$VERSION$$ --build-number=$$VERCODE$$

# UpdateCheckData is the documented Flutter form: versionName and versionCode
# come from flutter/app/pubspec.yaml (version: X.Y.Z+N). AutoUpdateMode without
# a pattern is the Tags-mode form — the checked tag supplies commit:. The
# rolling `dev` prerelease tag is deliberately not a version tag.
AutoUpdateMode: Version
UpdateCheckMode: Tags v\d+\.\d+\.\d+
UpdateCheckData: flutter/app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '0.1.2'
CurrentVersionCode: 102
