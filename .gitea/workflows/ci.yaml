# CI for deepseek-harness-app — runs the gates as three parallel jobs so a
# doc-only change fails in seconds instead of behind the Flutter suite. All
# three are required statuses on `master`
# (`CI / docs (pull_request)`, `CI / code (pull_request)`,
# `CI / android (pull_request)`).
#
#   docs    python3 scripts/verify_all.py docs — python only; needs the
#           reference submodule (the launcher-icon drift gate reads it)
#   code    python3 scripts/verify_all.py code — flutter analyze, dart format
#           check, the full test suite, the import gate, unused deps
#   android :app:compileDebugKotlin — the only gate that type-checks the
#           Android host's Kotlin; lint and the Dart gates cannot see an
#           unresolved platform reference. Decision:
#           .agents/notes/implemented/process/2026-09-03-kotlin-compile-gate.md
#
# Runner contract — the `flutter-android` label as this forge registers it is
# HOST execution: steps run on the runner machine itself, with the toolchain
# in `runner.envs.PATH` (~/tools/flutter-3.47.1, ~/android-sdk,
# ~/tools/jdk-17.0.13+11) and the host's own ~/.pub-cache and ~/.gradle as the
# dependency caches. No dependency is downloaded per job — only the checkout's
# reference submodule crosses the network — and no cache is restored here,
# because both directories persist between jobs. `runner.capacity: 2` caps
# concurrency, so the three jobs below time-share two slots. Decision:
# .agents/notes/implemented/process/2026-09-11-ci-runner-host-mode.md
#
# A container-schema label (`flutter-android:docker://flutter-3.47-android`)
# is the alternative the release channel was designed around: it isolates each
# job but makes every cache ephemeral, which is what `actions/cache` and the
# local image recipe (`docker/`, gitignored) exist to offset. Only the label
# decides this — a job runs in a container exactly when its label carries
# `docker://`.
name: CI

# A superseded push is waste on a pool of two slots shared with the release
# channel: the newest push to a ref cancels the older run. Branch builds share
# one group per ref, so a push never cancels another branch's verdict. A
# cancelled `master` run is not a lost verdict — the run for the next merge
# covers its tree, and the release channel re-runs the whole suite itself
# before it signs an APK.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    # python-only, but the checkout clones the reference submodule from
    # github.com — which needs the LAN egress proxy too (a proxy-less job
    # stalls on `git submodule update` exactly like pub did). Every job on
    # this label reaches the proxy through the runner's own environment, so
    # `docs` needs no toolchain step and finishes in seconds; it still holds
    # one of the two slots while it runs, which the timeout below bounds.
    runs-on: flutter-android
    # A wedged job must not own the single runner for hours: the release-APK
    # job once hung on pub's dependency resolution for 1h49m and queued every
    # PR behind it.
    timeout-minutes: 15
    steps:
      - name: Checkout (with reference submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Doc gates (links, budgets, notes, skills, launcher icons)
        run: python3 scripts/verify_all.py docs

  code:
    # Host execution (see the header): Flutter, the Android SDK and the JDK
    # come from the runner's PATH, and the host's ~/.pub-cache and ~/.gradle
    # are the caches every run reuses. The proxy env is declared from
    # `vars.EGRESS_PROXY` below: the variable is the single source of truth
    # for the egress address (it lives in the repo's Actions settings, never
    # in git), so a job is only ever proxy-less if the runner's own
    # environment and the variable both fail it.
    # Toolchain pin (verify_toolchain_pin.py reads this file as source):
    # flutter-version: 3.47.1 — the runner's PATH points at
    # ~/tools/flutter-3.47.1, and the first step below fails the job when the
    # live binary disagrees with this line.
    runs-on: flutter-android
    env:
      HTTP_PROXY: ${{ vars.EGRESS_PROXY }}
      HTTPS_PROXY: ${{ vars.EGRESS_PROXY }}
      http_proxy: ${{ vars.EGRESS_PROXY }}
      https_proxy: ${{ vars.EGRESS_PROXY }}
      NO_PROXY: gitea,localhost,127.0.0.1
      no_proxy: gitea,localhost,127.0.0.1
      # This runner shares the host's core count; uncapped, `flutter test`
      # spawns one tester per CPU and the suite gets OOM-killed (exit 137).
      DSH_TEST_CONCURRENCY: '4'
    # Bound the job the same way: a hung pub resolve inside any step must end
    # in a failed run, not a two-hour runner occupation.
    timeout-minutes: 60
    steps:
      - name: Checkout (with reference submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The pin's source is this file — verify_toolchain_pin.py reads
      # `flutter-version:` above and holds every other home to it — but in
      # host execution the binary comes from the runner's PATH, which no
      # repo-side gate can see. A host `flutter upgrade` would move CI off the
      # pin while every home still agreed, so the live version is asserted
      # against the line above before any gate trusts it.
      - name: Assert the runner's Flutter matches the pin
        run: |
          PIN=$(grep -oE 'flutter-version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' .gitea/workflows/ci.yaml \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          flutter --version
          flutter --version | grep -qE "^Flutter ${PIN} " \
            || { echo "the runner's Flutter is not the ${PIN} this file pins"; exit 1; }

      # Resolution happens exactly here, once, at a named step, and bounded:
      # pub's network resolve has hung inside this runner — the release build
      # sat on "Resolving dependencies..." for 1h49m, and an analyze gate
      # burned its whole 1800s ceiling on the same line — while the resolve
      # seconds later in the same job finished in 5s. A stalled resolve never
      # times out on its own, so each attempt is bounded and retried. With the
      # package config settled up front, the gates' own implicit resolves
      # become no-ops that never touch the network.
      - name: Resolve packages
        working-directory: flutter
        run: |
          for attempt in 1 2 3; do
            timeout 240 flutter pub get && exit 0
            echo "pub resolve attempt $attempt stalled or failed; retrying"
            sleep 5
          done
          exit 1

      - name: Code gates (analyze, format, tests, imports)
        run: python3 scripts/verify_all.py code

  android:
    # The compiler is the only check that sees an unresolved platform
    # symbol — how #153 shipped AudioManager constants no API has and left
    # the red to the release channel. compileDebugKotlin is that check
    # alone: no Dart AOT, asset merge, R8 or packaging. Host execution like
    # `code`, and the same host ~/.gradle: the plugin and AGP artifacts this
    # task resolves survive between jobs, so a warm start is the common case.
    runs-on: flutter-android
    timeout-minutes: 20
    env:
      HTTP_PROXY: ${{ vars.EGRESS_PROXY }}
      HTTPS_PROXY: ${{ vars.EGRESS_PROXY }}
      http_proxy: ${{ vars.EGRESS_PROXY }}
      https_proxy: ${{ vars.EGRESS_PROXY }}
      # The gradle JVM ignores HTTP_PROXY env and rides the system properties
      # in the runner machine's own ~/.gradle/gradle.properties, which persists
      # between runs — an address left there from an earlier route times out
      # every egress download and disables the Google repository with no
      # compile error anywhere (run 983). The compile step below rebuilds those
      # properties from the egress above at runtime, so no internal address is
      # ever committed; the JVM's default nonProxyHosts keeps localhost traffic
      # direct.
      NO_PROXY: gitea,localhost,127.0.0.1
      no_proxy: gitea,localhost,127.0.0.1
    steps:
      - name: Checkout (with reference submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # pub get's outputs are compile inputs: android/local.properties (the
      # plugin's flutter.sdk) and .flutter-plugins-dependencies (the plugin
      # projects settings.gradle includes).
      - name: Resolve packages
        working-directory: flutter
        run: |
          for attempt in 1 2 3; do
            timeout 240 flutter pub get && exit 0
            echo "pub resolve attempt $attempt stalled or failed; retrying"
            sleep 5
          done
          exit 1

      - name: Inject gradle wrapper
        working-directory: flutter/app/android
        run: |
          # The wrapper scripts are deliberately untracked
          # (flutter/app/android/.gitignore); `flutter build` injects them
          # from the SDK's universal gradle_wrapper artifact
          # (GradleUtils.injectGradleWrapperIfNeeded), which is how the
          # release build launches gradle without them. pub get in the step
          # above is what materialized the artifact in the SDK cache.
          WRAPPER="$(dirname "$(dirname "$(which flutter)")")/bin/cache/artifacts/gradle_wrapper"
          cp -n "$WRAPPER/gradlew" gradlew
          cp -n "$WRAPPER/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Kotlin type check (compileDebugKotlin)
        working-directory: flutter/app/android
        # Gradle's downloads flake through the LAN egress (the release
        # channel's history is the same story), so the check is bounded and
        # retried like the pub resolve above: a real compile error fails three
        # fast attempts, a flake self-heals on the next one. The proxy rides
        # the system properties gradle's JVM actually reads, derived from the
        # egress env above at runtime — an internal address never enters a
        # committed file.
        run: |
          EGRESS_HOST="${HTTPS_PROXY#http://}"
          EGRESS_HOST="${EGRESS_HOST%%:*}"
          EGRESS_PORT="${HTTPS_PROXY##*:}"
          if [ -z "$EGRESS_HOST" ] || [ "$EGRESS_HOST" = "$HTTPS_PROXY" ]; then
            echo "EGRESS proxy missing: HTTPS_PROXY is not set for this job"
            exit 1
          fi
          # Gradle's JVM reads its proxy route from gradle.properties
          # systemProp lines and ignores the HTTP_PROXY env, so the user-level
          # file is rewritten from the live egress env before every compile: a
          # value left from an earlier address eats every egress download
          # silently (run 989: fresh GRADLE_OPTS/JAVA_TOOL_OPTIONS still rode a
          # dead address and the Google repository was disabled with no
          # compile error anywhere).
          GRADLE_DIR="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GRADLE_DIR"
          printf 'systemProp.http.proxyHost=%s\nsystemProp.http.proxyPort=%s\nsystemProp.https.proxyHost=%s\nsystemProp.https.proxyPort=%s\n' \
            "$EGRESS_HOST" "$EGRESS_PORT" "$EGRESS_HOST" "$EGRESS_PORT" \
            > "$GRADLE_DIR/gradle.properties"
          export GRADLE_OPTS="-Dhttp.proxyHost=$EGRESS_HOST -Dhttp.proxyPort=$EGRESS_PORT -Dhttps.proxyHost=$EGRESS_HOST -Dhttps.proxyPort=$EGRESS_PORT"
          for attempt in 1 2 3; do
            ./gradlew :app:compileDebugKotlin && exit 0
            echo "kotlin check attempt $attempt failed; retrying"
            sleep 10
          done
          exit 1
