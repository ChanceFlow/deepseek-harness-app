# CI for deepseek-harness-app — runs the gate aggregate as two parallel
# jobs so a doc-only change fails in seconds instead of behind the Flutter
# suite. Both are required statuses on `master`
# (`CI / docs (pull_request)`, `CI / code (pull_request)`).
#
#   docs  python3 scripts/verify_all.py docs — python only; needs the
#         reference submodule (the launcher-icon drift gate reads it)
#   code  python3 scripts/verify_all.py code — flutter analyze, the full
#         test suite, the import gate
#
# Requirements for the runner:
#   - network access (fetches Flutter 3.47.1 via subosito/flutter-action and
#     the reference submodule from this forge instance)
#   - a runner image with Docker/act compatibility for `uses:` actions.
# Air-gapped runners: replace the flutter step with a prebaked image that
# has Flutter 3.47.1 stable and python3, then keep the verify step.
name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    # python-only, but the checkout clones the reference submodule from
    # github.com — which needs the LAN proxy too (a proxy-less ubuntu-latest
    # job stalls on `git submodule update` exactly like pub did). The
    # prebaked image has the proxy baked in, so run docs there as well.
    runs-on: flutter-android
    steps:
      - name: Checkout (with reference submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Doc gates (links, budgets, notes, skills, launcher icons)
        run: python3 scripts/verify_all.py docs

  code:
    # Runs on the prebaked builder image, not ubuntu-latest: the image
    # carries Flutter 3.47.1 on PATH and has the LAN egress proxy baked in
    # (ENV HTTP_PROXY=http://127.0.0.1:7890) — exactly how release-apk
    # reaches pub.dev. A plain ubuntu-latest job cannot rely on the
    # workflow env's `vars.EGRESS_PROXY`: this Gitea Actions build does not
    # resolve `vars.*` in env, so the job ran proxy-less and pub's large
    # package downloads hung. The proxy env is still declared here for a
    # runner that does resolve vars.
    runs-on: flutter-android
    env:
      HTTP_PROXY: ${{ vars.EGRESS_PROXY }}
      HTTPS_PROXY: ${{ vars.EGRESS_PROXY }}
      http_proxy: ${{ vars.EGRESS_PROXY }}
      https_proxy: ${{ vars.EGRESS_PROXY }}
      NO_PROXY: gitea,localhost,127.0.0.1
      no_proxy: gitea,localhost,127.0.0.1
    steps:
      - name: Checkout (with reference submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Code gates (analyze, tests, imports)
        run: python3 scripts/verify_all.py code
