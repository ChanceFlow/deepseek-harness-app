# Container-execution smoke test — proves the container-schema label runs jobs
# inside a container and answers the questions that decide the migration,
# before any merge gate depends on it.
#
# Disposable: delete it once `ci.yaml` and `release-apk.yaml` run on the
# container label and a green CI run has confirmed them.
#
#   1. Does the job run inside a container at all, and what does it see? The
#      decisive question is whether the runner injects its own `runner.envs`
#      (which point at the runner machine's toolchain) into the container and
#      overrides the image's PATH. Any line reading "HOST STATE VISIBLE" says
#      the container can still see the runner machine's toolchain — which the
#      point of this migration is to stop.
#   2. Does the container reach the forge, github.com and pub.dev through the
#      runner's egress?
#   3. When the image carries Flutter: what does `:app:compileDebugKotlin`
#      cost against its baked Gradle caches? Baselines: 95 s on the host's
#      warm ~/.gradle, 205 s on GitHub's cold runner.
name: Container smoke

on:
  push:
    paths: [".gitea/workflows/container-smoke.yaml"]
  workflow_dispatch:

jobs:
  probe:
    # Container-schema label — the schema in the label decides, not this file:
    # a label registered as `docker://<image>` runs these steps inside that
    # image, while a `host` label would run them on the runner machine.
    runs-on: flutter-android-ctr
    timeout-minutes: 25
    steps:
      - name: What the job container sees
        run: |
          echo "hostname  : $(hostname)"
          echo "user      : $(id -un)  HOME=$HOME"
          echo "PATH      : $PATH"
          echo "opt dirs  : $(ls -d /opt/* 2>/dev/null | tr '\n' ' ')"
          echo "flutter   : $(command -v flutter || echo 'ABSENT')"
          echo "java      : $(command -v java || echo 'ABSENT')"
          echo "node      : $(command -v node || echo 'ABSENT — actions cannot run without it')"
          # Run 1410: the runner's `runner.envs.PATH` pointed at the runner
          # machine's toolchain, so the container lost its own PATH and `node`
          # with it — every `uses:` step then died with exit 127. A container
          # job must never see that PATH again.
          case "$PATH" in
            *"/home/"*) echo "FAIL: the runner injected its own PATH into this container"; exit 1 ;;
          esac
          case "${JAVA_HOME:-}" in
            /home/*) echo "FAIL: JAVA_HOME points at the runner machine"; exit 1 ;;
          esac
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}  JAVA_HOME=${JAVA_HOME:-<unset>}"
          echo "pub cache : $(du -sh "${PUB_CACHE:-$HOME/.pub-cache}" 2>/dev/null | cut -f1)"
          echo "gradle    : $(du -sh "$HOME/.gradle" 2>/dev/null | cut -f1)"
          # The whole point: none of these may exist inside the container.
          for d in /home/*/tools/flutter-3.47.1 /home/*/android-sdk /home/*/.gradle /home/*/.pub-cache /opt/flutter /opt/android-sdk; do
            if [ -e "$d" ]; then echo "VISIBLE: $d"; fi
          done
          echo "(a VISIBLE line naming the runner machine's ~/tools or ~/android-sdk is the failure this migration removes)"

      - name: Checkout (with reference submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Egress from inside the container
        run: |
          for u in https://github.com/deepseek-ai/deepseek-harness.git https://pub.dev; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$u" 2>/dev/null || echo fail)
            echo "$u -> $code"
          done

      - name: Resolve packages and type-check Kotlin (only when the image has Flutter)
        working-directory: flutter
        run: |
          command -v flutter >/dev/null || {
            echo "image carries no Flutter toolchain — plumbing smoke only, skipping"
            exit 0
          }
          time flutter pub get
          cd app/android
          WRAPPER="$(dirname "$(dirname "$(which flutter)")")/bin/cache/artifacts/gradle_wrapper"
          cp -n "$WRAPPER/gradlew" gradlew
          cp -n "$WRAPPER/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          EGRESS_HOST="${HTTPS_PROXY#http://}"; EGRESS_HOST="${EGRESS_HOST%%:*}"
          EGRESS_PORT="${HTTPS_PROXY##*:}"
          if [ -n "$EGRESS_HOST" ] && [ "$EGRESS_HOST" != "$HTTPS_PROXY" ]; then
            GRADLE_DIR="${GRADLE_USER_HOME:-$HOME/.gradle}"
            mkdir -p "$GRADLE_DIR"
            printf 'systemProp.http.proxyHost=%s\nsystemProp.http.proxyPort=%s\nsystemProp.https.proxyHost=%s\nsystemProp.https.proxyPort=%s\n' \
              "$EGRESS_HOST" "$EGRESS_PORT" "$EGRESS_HOST" "$EGRESS_PORT" > "$GRADLE_DIR/gradle.properties"
          fi
          time ./gradlew :app:compileDebugKotlin
