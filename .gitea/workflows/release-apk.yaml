# APK release pipeline — builds the signed release APK and publishes it
# as a Gitea Release attachment (the primary distribution channel), then
# mirrors the artifact to the public GitHub repo
# (ChanceFlow/deepseek-harness-app — the shared-history public source).
# The GitHub release body is sanitized by contract: no Gitea URLs, no PR
# links, no DSH_BASE_URL (a dispatch-supplied endpoint would publish the
# operator's addressing; the loopback default is not release-facing
# either), no commit field.
#
# Naming standard (industry / SemVer 2.0):
#   - release tags:    v<semver>            v0.1.0, v0.1.0-alpha.1,
#                                            v0.1.0-beta.2, v0.1.0-rc.1
#   - versionName:     tag sans v           0.1.0, 0.1.0-alpha.1
#   - dev builds:      <next>-alpha.<run>   push to master OR
#                                            workflow_dispatch, where <next>
#                                            is the latest STABLE v* tag with
#                                            its patch bumped (v0.0.2 -> 0.0.3)
#   - artifacts:       dsh-android-<versionName>.apk (+ .sha256 sidecar)
#   - release titles:  DSH Android <versionName>
#   - dev channel:     rolling prerelease on the tag `dev` (no `v`
#     prefix — deliberately outside the `v*` tag trigger, so the
#     release API's tag creation can never re-trigger this pipeline);
#     every dev build replaces it (auto on every master push, plus
#     manual workflow_dispatch), so /releases/tag/dev always serves
#     the newest master build.
#   - release bodies:  "What's Changed" changelog generated by
#     scripts/gen_release_notes.py — merged pull-request titles since
#     the previous stable v* tag, grouped by Conventional Commit type
#     and linked to their pull requests — followed by the artifact
#     metadata block.
#
# Runs on the prebaked `flutter-android` runner label built by
# docker/build-image.sh (Flutter 3.47 + Android SDK + JDK 17 + dependency
# caches the image warms itself from the committed workspace — no SDK or
# maven downloads per run). Gradle's build cache and pub cache are carried
# across runs via actions/cache (the runner's cache service) so
# repeat builds reuse compiled task outputs instead of recompiling.
# Tooling contract lives in the process note
# .agents/notes/implemented/process/2026-08-20-apk-release-ci.md.
name: Release APK

on:
  workflow_dispatch:
    inputs:
      dsh_base_url:
        description: "DSH_BASE_URL baked into the APK"
        default: "http://127.0.0.1:3080"
        required: false
  push:
    tags: ["v*"]
    branches: ["master"]

permissions:
  contents: write

defaults:
  run:
    # act's default `sh` has no [[ ]]; the image ships bash.
    shell: bash

jobs:
  build:
    runs-on: flutter-android
    container:
      image: flutter-3.47-android:latest
    env:
      HTTP_PROXY: ${{ vars.EGRESS_PROXY }}
      HTTPS_PROXY: ${{ vars.EGRESS_PROXY }}
      http_proxy: ${{ vars.EGRESS_PROXY }}
      https_proxy: ${{ vars.EGRESS_PROXY }}
      # the runner's cache service (actions/cache) must bypass the proxy
      # or restore/save dies on connection reset.
      NO_PROXY: gitea,localhost,127.0.0.1
      no_proxy: gitea,localhost,127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The resolve step reads the latest stable v* tag to derive the
          # next alpha version; a shallow clone has none.
          fetch-depth: 0

      # Job containers are ephemeral: the image's baked dependency caches
      # survive, but Gradle build-cache outputs (task-level compilation
      # results) were lost with every container. Restore them here so
      # repeat builds reuse compiled artifacts instead of recompiling.
      - name: Restore Gradle & pub caches
        uses: actions/cache@v4
        with:
          path: |
            /root/.gradle/caches
            /root/.pub-cache
          key: gradle-v1-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: gradle-v1-

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            CHANNEL=release
          else
            git fetch --tags --quiet origin || true
            # Latest stable v* tag (prerelease suffixes sort below their
            # base; drop them), patch-bumped as the alpha baseline.
            LATEST=$(git tag -l 'v*' --sort=-v:refname \
              | grep -vE -- '-(alpha|beta|rc|dev)[.]?[0-9]*$' | head -1)
            LATEST=${LATEST:-v0.0.0}
            IFS=. read -r MAJ MIN PAT <<< "${LATEST#v}"
            VERSION="$MAJ.$MIN.$((PAT + 1))-alpha.$GITHUB_RUN_NUMBER"
            CHANNEL=dev
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          # Telemetry rides the version channel (the same _PRERELEASE
          # classifier as scripts/gen_release_notes.py): prerelease
          # versions report, stable versions are compiled out
          # (DSH_TELEMETRY_ENABLED=false folds the gate at compile time,
          # so the AOT build tree-shakes the telemetry chain to zero
          # residue in stable APKs).
          if grep -qE -- '-(alpha|beta|rc|dev)[.]?[0-9]*$' <<< "$VERSION"; then
            echo "telemetry=true" >> "$GITHUB_OUTPUT"
          else
            echo "telemetry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pub get (workspace)
        working-directory: flutter
        run: flutter pub get

      - name: Analyze (fail before the slow build)
        working-directory: flutter
        run: flutter analyze

      - name: Build signed release APK
        working-directory: flutter/app
        env:
          DSH_KEYSTORE_FILE: /tmp/dsh-release.keystore
          DSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$DSH_KEYSTORE_FILE"
          flutter build apk --release \
            --dart-define=DSH_BASE_URL="${{ inputs.dsh_base_url || 'http://127.0.0.1:3080' }}" \
            --dart-define=DSH_APP_VERSION="${{ steps.ver.outputs.version }}" \
            --dart-define=DSH_TELEMETRY_ENABLED="${{ steps.ver.outputs.telemetry }}" \
            --build-name="${{ steps.ver.outputs.version }}" \
            --build-number="$GITHUB_RUN_NUMBER"
          rm -f "$DSH_KEYSTORE_FILE"

      - name: Generate changelog
        id: changelog
        run: |
          EXCLUDE=""
          [[ "${{ steps.ver.outputs.channel }}" == "release" ]] && EXCLUDE="$GITHUB_REF_NAME"
          python3 scripts/gen_release_notes.py \
            --repo . \
            --head "$GITHUB_SHA" \
            --exclude-tag "$EXCLUDE" \
            --base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            > /tmp/changelog.md
          echo "--- generated changelog ---"
          cat /tmp/changelog.md

      - name: Stage artifact
        id: stage
        run: |
          APK="dsh-android-${{ steps.ver.outputs.version }}.apk"
          cp flutter/app/build/app/outputs/flutter-apk/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$APK.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish Gitea Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -eu
          APK="${{ steps.stage.outputs.apk }}"
          VERSION="${{ steps.ver.outputs.version }}"
          CHANNEL="${{ steps.ver.outputs.channel }}"
          BASE_URL="${{ inputs.dsh_base_url || 'http://127.0.0.1:3080' }}"
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: token $GITHUB_TOKEN"

          if [[ "$CHANNEL" == "release" ]]; then
            TAG="$GITHUB_REF_NAME"
            PRERELEASE=false
          else
            # Rolling dev channel: replace the prerelease under the
            # `dev` tag (outside the v* trigger) so the newest master
            # build is always the one served there.
            TAG="dev"
            PRERELEASE=true
            OLD_REL_ID=$(curl -sf "$API/releases/tags/dev" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' \
              || true)
            if [[ -n "${OLD_REL_ID:-}" ]]; then
              curl -sf -X DELETE "$API/releases/$OLD_REL_ID" -H "$AUTH" || true
            fi
            curl -sf -X DELETE "$API/tags/dev" -H "$AUTH" || true
          fi

          python3 - "$TAG" "DSH Android $VERSION" "$PRERELEASE" "$VERSION" "$GITHUB_RUN_NUMBER" \
            "$APK" "${{ steps.stage.outputs.sha256 }}" "$BASE_URL" \
            "$GITHUB_SHA" "$CHANNEL" > /tmp/release.json <<'PY'
          import json, os, sys
          tag, name, prerelease, ver, run, apk, sha, base_url, commit, channel = sys.argv[1:11]
          pre = prerelease == "true"
          meta = (
              f"- versionName: `{ver}`\n"
              f"- versionCode: `{run}`\n"
              f"- sha256: `{sha}`\n"
              f"- DSH_BASE_URL: `{base_url}`\n"
              f"- commit: `{commit[:12]}`\n"
          )
          changelog = ""
          if os.path.exists("/tmp/changelog.md"):
              with open("/tmp/changelog.md") as fh:
                  changelog = fh.read().strip()
          parts = []
          if channel == "dev":
              parts.append(
                  "Rolling dev channel — always the latest `master` build; "
                  "this artifact supersedes any earlier dev build."
              )
          if changelog:
              parts.append("## What's Changed\n\n" + changelog)
          parts.append(meta)
          body = "\n\n".join(parts)
          print(json.dumps({
              "tag_name": tag,
              "name": name,
              "body": body,
              "prerelease": pre,
              "target_commitish": commit,
          }))
          PY
          REL_ID=$(curl -sf -X POST "$API/releases" -H "$AUTH" \
            -H 'Content-Type: application/json' -d @/tmp/release.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for f in "$APK" "$APK.sha256"; do
            curl -sf -X POST "$API/releases/$REL_ID/assets?name=$f" -H "$AUTH" \
              -F "attachment=@$f" >/dev/null
          done
          echo "release $TAG created (id $REL_ID) with $APK"

      - name: Publish GitHub shadow Release (mirror)
        env:
          GH_PUB_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
        run: |
          set -u
          if [[ -z "$GH_PUB_TOKEN" ]]; then
            echo "::warning::GH_PUBLISH_TOKEN not set - skipping GitHub shadow release"
            exit 0
          fi
          APK="${{ steps.stage.outputs.apk }}"
          VERSION="${{ steps.ver.outputs.version }}"
          CHANNEL="${{ steps.ver.outputs.channel }}"
          API="https://api.github.com/repos/ChanceFlow/deepseek-harness-app"
          AUTH="Authorization: token $GH_PUB_TOKEN"

          if [[ "$CHANNEL" == "release" ]]; then
            TAG="$GITHUB_REF_NAME"
            PRE=false
          else
            TAG="dev"
            PRE=true
            OLD_ID=$(curl -sf "$API/releases/tags/dev" -H "$AUTH" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' || true)
            [[ -n "${OLD_ID:-}" ]] && curl -sf -X DELETE "$API/releases/$OLD_ID" -H "$AUTH" >/dev/null || true
            curl -sf -X DELETE "$API/git/refs/tags/dev" -H "$AUTH" >/dev/null || true
          fi

          # Sanitized body (see header comment): version metadata + hash only.
          python3 - "$TAG" "deepseek-harness-app $VERSION" "$PRE" "$VERSION" "$GITHUB_RUN_NUMBER" \
            "$APK" "${{ steps.stage.outputs.sha256 }}" > /tmp/gh-release.json <<'PY'
          import json, sys
          tag, name, pre, ver, run, apk, sha = sys.argv[1:8]
          meta = (
              f"- versionName: `{ver}`\n"
              f"- versionCode: `{run}`\n"
              f"- sha256: `{sha}`\n"
          )
          intro = (
              "Rolling dev channel - always the latest `master` build; "
              "this artifact supersedes any earlier dev build.\n"
              if pre == "true" else
              "Stable release - changelog lives on the internal release "
              "channel; this mirror carries the artifact only.\n"
          )
          print(json.dumps({"tag_name": tag, "name": name, "body": intro + meta, "prerelease": pre == "true"}))
          PY

          REL_ID=$(curl -sf -X POST "$API/releases" -H "$AUTH" \
            -H 'Content-Type: application/json' -d @/tmp/gh-release.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])') || {
              echo "::warning::GitHub shadow release creation failed - Gitea release is already published"
              exit 0
            }
          for f in "$APK" "$APK.sha256"; do
            NAME=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$f")
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$API/releases/$REL_ID/assets?name=$NAME" >/dev/null \
              || echo "::warning::GitHub asset upload failed for $f"
          done
          echo "github shadow release $TAG created (id $REL_ID)"
