# APK release pipeline — builds the signed release APK and publishes it
# as a Gitea Release attachment (the only distribution channel).
#
# Naming standard (industry / SemVer 2.0):
#   - release tags:    v<semver>            v0.1.0, v0.1.0-alpha.1,
#                                            v0.1.0-beta.2, v0.1.0-rc.1
#   - versionName:     tag sans v           0.1.0, 0.1.0-alpha.1
#   - dev builds:      0.0.0-dev.<run>      workflow_dispatch on master
#   - artifacts:       dsh-android-<versionName>.apk (+ .sha256 sidecar)
#   - dev channel:     rolling prerelease on the tag `dev` (no `v`
#     prefix — deliberately outside the `v*` tag trigger, so the
#     release API's tag creation can never re-trigger this pipeline);
#     every dispatch build replaces it, so
#     /releases/tag/dev always serves the newest master build.
#
# Runs on the prebaked `flutter-android` runner label built by
# docker/build-image.sh (Flutter 3.47 + Android SDK + JDK 17 + dependency
# caches the image warms itself from the committed workspace — no SDK or
# maven downloads per run). Gradle's build cache and pub cache are carried
# across runs via actions/cache (runner cache server, runner:3899) so
# repeat builds reuse compiled task outputs instead of recompiling.
# Tooling contract lives in the process note
# .agents/notes/implemented/process/2026-08-20-apk-release-ci.md.
name: Release APK

on:
  workflow_dispatch:
    inputs:
      dsh_base_url:
        description: "DSH_BASE_URL baked into the APK"
        default: "http://127.0.0.1:3080"
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    # act's default `sh` has no [[ ]]; the image ships bash.
    shell: bash

jobs:
  build:
    runs-on: flutter-android
    container:
      image: flutter-3.47-android:latest
    env:
      HTTP_PROXY: ${{ vars.EGRESS_PROXY }}
      HTTPS_PROXY: ${{ vars.EGRESS_PROXY }}
      http_proxy: ${{ vars.EGRESS_PROXY }}
      https_proxy: ${{ vars.EGRESS_PROXY }}
      # runner = the runner's cache server (actions/cache); it must
      # bypass the proxy or restore/save dies on connection reset.
      NO_PROXY: gitea,localhost,127.0.0.1,127.0.0.1,runner
      no_proxy: gitea,localhost,127.0.0.1,127.0.0.1,runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Job containers are ephemeral: the image's baked dependency caches
      # survive, but Gradle build-cache outputs (task-level compilation
      # results) were lost with every container. Restore them here so
      # repeat builds reuse compiled artifacts instead of recompiling.
      - name: Restore Gradle & pub caches
        uses: actions/cache@v4
        with:
          path: |
            /root/.gradle/caches
            /root/.pub-cache
          key: gradle-v1-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: gradle-v1-

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Pub get (workspace)
        working-directory: flutter
        run: flutter pub get

      - name: Analyze (fail before the slow build)
        working-directory: flutter
        run: flutter analyze

      - name: Build signed release APK
        working-directory: flutter/app
        env:
          DSH_KEYSTORE_FILE: /tmp/dsh-release.keystore
          DSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$DSH_KEYSTORE_FILE"
          flutter build apk --release \
            --dart-define=DSH_BASE_URL="${{ inputs.dsh_base_url || 'http://127.0.0.1:3080' }}" \
            --build-name="${{ steps.ver.outputs.version }}" \
            --build-number="$GITHUB_RUN_NUMBER"
          rm -f "$DSH_KEYSTORE_FILE"

      - name: Stage artifact
        id: stage
        run: |
          APK="dsh-android-${{ steps.ver.outputs.version }}.apk"
          cp flutter/app/build/app/outputs/flutter-apk/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$APK.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish Gitea Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -eu
          APK="${{ steps.stage.outputs.apk }}"
          VERSION="${{ steps.ver.outputs.version }}"
          CHANNEL="${{ steps.ver.outputs.channel }}"
          BASE_URL="${{ inputs.dsh_base_url || 'http://127.0.0.1:3080' }}"
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: token $GITHUB_TOKEN"

          if [[ "$CHANNEL" == "release" ]]; then
            TAG="$GITHUB_REF_NAME"
            NAME="DSH Android $VERSION"
            PRERELEASE=false
          else
            # Rolling dev channel: replace the prerelease under the
            # `dev` tag (outside the v* trigger) so the newest master
            # build is always the one served there.
            TAG="dev"
            NAME="DSH Android Dev"
            PRERELEASE=true
            OLD_REL_ID=$(curl -sf "$API/releases/tags/dev" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' \
              || true)
            if [[ -n "${OLD_REL_ID:-}" ]]; then
              curl -sf -X DELETE "$API/releases/$OLD_REL_ID" -H "$AUTH" || true
            fi
            curl -sf -X DELETE "$API/tags/dev" -H "$AUTH" || true
          fi

          python3 - "$TAG" "$NAME" "$PRERELEASE" "$VERSION" "$GITHUB_RUN_NUMBER" \
            "$APK" "${{ steps.stage.outputs.sha256 }}" "$BASE_URL" \
            "$GITHUB_SHA" "$CHANNEL" > /tmp/release.json <<'PY'
          import json, sys
          tag, name, prerelease, ver, run, apk, sha, base_url, commit, channel = sys.argv[1:11]
          pre = prerelease == "true"
          body = (
              f"- versionName: `{ver}`\n"
              f"- versionCode: `{run}`\n"
              f"- sha256: `{sha}`\n"
              f"- DSH_BASE_URL: `{base_url}`\n"
              f"- commit: `{commit[:12]}`\n"
          )
          if channel == "dev":
              body = (
                  "Rolling dev channel — always the latest `master` build; "
                  "this artifact supersedes any earlier dev build.\n\n" + body
              )
          print(json.dumps({
              "tag_name": tag,
              "name": name,
              "body": body,
              "prerelease": pre,
              "target_commitish": commit,
          }))
          PY
          REL_ID=$(curl -sf -X POST "$API/releases" -H "$AUTH" \
            -H 'Content-Type: application/json' -d @/tmp/release.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for f in "$APK" "$APK.sha256"; do
            curl -sf -X POST "$API/releases/$REL_ID/assets?name=$f" -H "$AUTH" \
              -F "attachment=@$f" >/dev/null
          done
          echo "release $TAG created (id $REL_ID) with $APK"
