# APK release pipeline — builds the signed release APK and publishes it
# as a Gitea Release attachment (the primary distribution channel), then
# mirrors the artifact to the public GitHub repo
# (ChanceFlow/deepseek-harness-app — the shared-history public source).
# The GitHub release body is sanitized by contract: no Gitea URLs, no PR
# links, no DSH_BASE_URL (a dispatch-supplied endpoint would publish the
# operator's addressing; the loopback default is not release-facing
# either), no commit field.
#
# Naming standard (industry / SemVer 2.0):
#   - release tags:    v<semver>            v0.1.0, v0.1.0-alpha.1,
#                                            v0.1.0-beta.2, v0.1.0-rc.1
#   - versionName:     tag sans v           0.1.0, 0.1.0-alpha.1
#   - dev builds:      <next>-alpha.<run>   push to master OR
#                                            workflow_dispatch, where <next>
#                                            is the latest STABLE v* tag with
#                                            its patch bumped (v0.0.2 -> 0.0.3)
#   - artifacts:       dsh-android-<versionName>-<abi>.apk (+ .sha256 sidecar),
#                      one per ABI (arm64-v8a, armeabi-v7a, x86_64), plus the
#                      downloadable ASR runtime per ABI
#                      (asr-runtime-<sherpaVersion>-<abi>-<lib>.so)
#   - release titles:  DSH Android <versionName>
#   - dev channel:     rolling prerelease on the tag `dev` (no `v`
#     prefix — deliberately outside the `v*` tag trigger, so the
#     release API's tag creation can never re-trigger this pipeline);
#     every dev build replaces it (auto on every master push, plus
#     manual workflow_dispatch), so /releases/tag/dev always serves
#     the newest master build.
#   - release bodies:  "What's Changed" changelog generated by
#     scripts/gen_release_notes.py — merged pull-request titles since
#     the previous stable v* tag, grouped by Conventional Commit type
#     and linked to their pull requests — followed by the artifact
#     metadata block.
#
# Runs on the `flutter-android` label, which this forge registers as HOST
# execution: Flutter 3.47.1, the Android SDK and JDK 17 come from the runner's
# own PATH and the host's ~/.gradle and ~/.pub-cache are the caches every run
# reuses, so no dependency is downloaded per run and no cache is restored
# here. The local image recipe (`docker/`, gitignored) and actions/cache
# belong to the container-schema label
# (`flutter-android:docker://flutter-3.47-android`), which is not registered
# today — see
# .agents/notes/implemented/process/2026-09-11-ci-runner-host-mode.md.
# Tooling contract lives in the process note
# .agents/notes/implemented/process/2026-08-20-apk-release-ci.md.
name: Release APK

# Only the newest build matters: the dev channel is rolling and a stable cut
# is re-runnable, so superseded queued/running builds are pure waste on a
# shared runner pool (2026-08-29: a master merge + tag push fired two full
# Gradle builds of adjacent commits).
# Branch builds share one group — the newest master push cancels older dev
# builds. Tag builds get their own group so a routine merge can never cancel
# a stable release in flight, while two tags in quick succession still
# collapse to the newest.
concurrency:
  group: release-apk-${{ github.ref_type == 'tag' && 'stable' || 'latest' }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      dsh_base_url:
        description: "DSH_BASE_URL baked into the APK"
        default: "http://127.0.0.1:3080"
        required: false
  push:
    tags: ["v*"]
    branches: ["master"]

permissions:
  contents: write

defaults:
  run:
    # act's default `sh` has no [[ ]]; the runner machine ships bash.
    shell: bash

jobs:
  build:
    runs-on: flutter-android
    timeout-minutes: 90
    env:
      HTTP_PROXY: ${{ vars.EGRESS_PROXY }}
      HTTPS_PROXY: ${{ vars.EGRESS_PROXY }}
      http_proxy: ${{ vars.EGRESS_PROXY }}
      https_proxy: ${{ vars.EGRESS_PROXY }}
      # The forge API the publish steps curl, and every host-local address,
      # stay direct: the proxied route to them resets the connection mid-body.
      NO_PROXY: gitea,localhost,127.0.0.1
      no_proxy: gitea,localhost,127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The resolve step reads the latest stable v* tag to derive the
          # next alpha version; a shallow clone has none.
          fetch-depth: 0

      # No cache step: host execution makes ~/.gradle and ~/.pub-cache the
      # runner machine's own persistent directories, so a restore costs the
      # run and buys nothing (measured 2026-09-11: a 2.6 GB restore takes
      # 100 s and reports "not saving cache" on a hit, while overwriting the
      # live caches with an older snapshot). actions/cache belongs to the
      # container label, whose job container starts from the image and loses
      # every task output at teardown.

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            CHANNEL=release
          else
            git fetch --tags --quiet origin || true
            # Latest stable v* tag (prerelease suffixes sort below their
            # base; drop them), patch-bumped as the alpha baseline.
            LATEST=$(git tag -l 'v*' --sort=-v:refname \
              | grep -vE -- '-(alpha|beta|rc|dev)[.]?[0-9]*$' | head -1)
            LATEST=${LATEST:-v0.0.0}
            IFS=. read -r MAJ MIN PAT <<< "${LATEST#v}"
            VERSION="$MAJ.$MIN.$((PAT + 1))-alpha.$GITHUB_RUN_NUMBER"
            CHANNEL=dev
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          # Telemetry rides the version channel (the same _PRERELEASE
          # classifier as scripts/gen_release_notes.py): prerelease
          # versions report, stable versions are compiled out
          # (DSH_TELEMETRY_ENABLED=false folds the gate at compile time,
          # so the AOT build tree-shakes the telemetry chain to zero
          # residue in stable APKs).
          if grep -qE -- '-(alpha|beta|rc|dev)[.]?[0-9]*$' <<< "$VERSION"; then
            echo "telemetry=true" >> "$GITHUB_OUTPUT"
          else
            echo "telemetry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pub get (workspace)
        working-directory: flutter
        # A stalled resolve never times out on its own: this step once hung for
        # 1h49m and held the single runner while every PR queued behind it.
        run: |
          for attempt in 1 2 3; do
            timeout 240 flutter pub get && exit 0
            echo "pub resolve attempt $attempt stalled or failed; retrying"
            sleep 5
          done
          exit 1

      - name: Analyze (fail before the slow build)
        working-directory: flutter
        run: flutter analyze

      # A signed artifact is the one output that cannot be withdrawn once a
      # user has installed it, so the release build runs the whole suite
      # itself instead of trusting that CI passed on the same tree. The
      # real-host e2e test self-skips without DSH_E2E_URL, as it does in CI.
      - name: Test (the signed artifact must be green)
        working-directory: flutter
        run: |
          flutter test app/test packages/domain/test packages/network/test \
            packages/harness_adapter/test packages/dev/test \
            packages/asr/test

      # Gradle's JVM reads its proxy route from gradle.properties systemProp
      # lines and ignores the HTTP_PROXY env above it — unlike curl and pub, it
      # has no env-proxy fallback. That file is the runner machine's own
      # user-level ~/.gradle/gradle.properties and persists between runs, so an
      # address left there from a route that has since moved takes every egress
      # download with it (warm-cache runs never notice). Rewrite host and port
      # from the repo's EGRESS_PROXY var so the value Gradle uses is always the
      # live one; drop the proxy lines entirely when the var is absent.
      - name: Align Gradle proxy with EGRESS_PROXY
        env:
          EGRESS: ${{ vars.EGRESS_PROXY }}
        run: |
          set -eu
          GRADLE_DIR="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GRADLE_DIR"
          GP="$GRADLE_DIR/gradle.properties"
          if [[ -z "$EGRESS" ]]; then
            sed -i -E '/^systemProp\.(http|https)\.proxy(Host|Port)=/d' "$GP" 2>/dev/null || true
            echo "EGRESS_PROXY unset: Gradle proxy lines removed"
            exit 0
          fi
          HOSTPORT=${EGRESS#*://}
          HOST=${HOSTPORT%%:*}
          PORT=7890
          if [[ "$HOSTPORT" == *:* ]]; then PORT=${HOSTPORT##*:}; fi
          touch "$GP"
          for scheme in http https; do
            for kv in "proxyHost=$HOST" "proxyPort=$PORT"; do
              key="systemProp.${scheme}.${kv%%=*}"
              if grep -q "^${key}=" "$GP"; then
                sed -i -E "s|^${key}=.*|${key}=${kv#*=}|" "$GP"
              else
                echo "${key}=${kv#*=}" >> "$GP"
              fi
            done
          done
          echo "Gradle proxy set to $HOST:$PORT"
          cat "$GP"

      # Android build define contract — the same set in the GitHub mirror and
      # in metadata/com.deepseek.harness.app.yml: cronetHttpNoPlay=true is
      # mandatory, DSH_BASE_URL is addressing, DSH_APP_VERSION is provenance,
      # and DSH_TELEMETRY_ENABLED rides the channel (prerelease true, stable
      # false). See .agents/notes/implemented/process/
      # 2026-09-11-android-release-build-contract.md.
      - name: Build signed release APK
        working-directory: flutter/app
        env:
          DSH_KEYSTORE_FILE: /tmp/dsh-release.keystore
          DSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$DSH_KEYSTORE_FILE"
          # Per-ABI APKs: a universal release carries all three ABI copies of
          # the native libraries and measured 161 MB, of which 2 MB is
          # everything that is not `lib/`. A phone installs exactly one ABI.
          flutter build apk --release --split-per-abi \
            --dart-define=cronetHttpNoPlay=true \
            --dart-define=DSH_BASE_URL="${{ inputs.dsh_base_url || 'http://127.0.0.1:3080' }}" \
            --dart-define=DSH_APP_VERSION="${{ steps.ver.outputs.version }}" \
            --dart-define=DSH_TELEMETRY_ENABLED="${{ steps.ver.outputs.telemetry }}" \
            --dart-define=DSH_SOURCE_COMMIT="$GITHUB_SHA" \
            --dart-define=DSH_SOURCE_REPO="$GITHUB_REPOSITORY" \
            --dart-define=DSH_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            --build-name="${{ steps.ver.outputs.version }}" \
            --build-number="$GITHUB_RUN_NUMBER"
          rm -f "$DSH_KEYSTORE_FILE"

      - name: Generate changelog
        id: changelog
        run: |
          EXCLUDE=""
          [[ "${{ steps.ver.outputs.channel }}" == "release" ]] && EXCLUDE="$GITHUB_REF_NAME"
          python3 scripts/gen_release_notes.py \
            --repo . \
            --head "$GITHUB_SHA" \
            --exclude-tag "$EXCLUDE" \
            --base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            > /tmp/changelog.md
          echo "--- generated changelog ---"
          cat /tmp/changelog.md

      - name: Stage artifacts
        id: stage
        run: |
          # Flutter names a split APK `app-<abi>-release.apk`
          # (flutter_tools `android/gradle.dart` `_apkFilesFor`); a missing one
          # is a hard error rather than a release with an ABI hole.
          set -eu
          OUT=flutter/app/build/app/outputs/flutter-apk
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE=/tmp/dsh-apks
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          : > "$STAGE/hashes.md"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SRC="$OUT/app-$abi-release.apk"
            if [[ ! -f "$SRC" ]]; then
              echo "::error::missing split artifact $SRC"
              exit 1
            fi
            NAME="dsh-android-$VERSION-$abi.apk"
            cp "$SRC" "$STAGE/$NAME"
            (cd "$STAGE" && sha256sum "$NAME" > "$NAME.sha256")
            printf -- '- `%s` sha256: `%s`\n' "$NAME" \
              "$(cut -d' ' -f1 "$STAGE/$NAME.sha256")" >> "$STAGE/hashes.md"
          done
          # arm64 is the ABI essentially every phone installs, so it is the
          # release body's headline hash and the name a single-artifact step
          # would use; every publish step uploads the whole directory.
          APK="dsh-android-$VERSION-arm64-v8a.apk"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$STAGE/$APK.sha256")" >> "$GITHUB_OUTPUT"

          # The on-device ASR runtime is downloaded, not bundled: the APK
          # excludes these libraries and the app fetches the pair matching its
          # own ABI from this release (`packages/asr` AsrRuntimeManager, whose
          # manifest pins the sizes and hashes regenerated from the same
          # packages this step copies). Served raw, so the bytes the app
          # verifies are the bytes it maps.
          PUB="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"
          SHERPA="$(basename "$(ls -d "$PUB"/sherpa_onnx-* | head -1)")"
          SHERPA="${SHERPA#sherpa_onnx-}"
          for pair in \
            "arm64-v8a:sherpa_onnx_android_arm64" \
            "armeabi-v7a:sherpa_onnx_android_armeabi" \
            "x86_64:sherpa_onnx_android_x86_64"; do
            abi="${pair%%:*}"
            pkg="${pair##*:}"
            jni="$(ls -d "$PUB/$pkg"-*/android/src/main/jniLibs/"$abi" | head -1)"
            for lib in libonnxruntime.so libsherpa-onnx-c-api.so; do
              NAME="asr-runtime-$SHERPA-$abi-$lib"
              cp "$jni/$lib" "$STAGE/$NAME"
              printf -- '- `%s` sha256: `%s`\n' "$NAME" \
                "$(sha256sum "$STAGE/$NAME" | cut -d' ' -f1)" >> "$STAGE/hashes.md"
            done
          done
          ls -1 "$STAGE"

      - name: Publish Gitea Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -eu
          APK="${{ steps.stage.outputs.apk }}"
          VERSION="${{ steps.ver.outputs.version }}"
          CHANNEL="${{ steps.ver.outputs.channel }}"
          BASE_URL="${{ inputs.dsh_base_url || 'http://127.0.0.1:3080' }}"
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: token $GITHUB_TOKEN"

          if [[ "$CHANNEL" == "release" ]]; then
            TAG="$GITHUB_REF_NAME"
            PRERELEASE=false
          else
            # Rolling dev channel: replace the prerelease under the
            # `dev` tag (outside the v* trigger) so the newest master
            # build is always the one served there.
            TAG="dev"
            PRERELEASE=true
            OLD_REL_ID=$(curl -sf "$API/releases/tags/dev" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' \
              || true)
            if [[ -n "${OLD_REL_ID:-}" ]]; then
              curl -sf -X DELETE "$API/releases/$OLD_REL_ID" -H "$AUTH" || true
            fi
            curl -sf -X DELETE "$API/tags/dev" -H "$AUTH" || true
          fi

          python3 - "$TAG" "DSH Android $VERSION" "$PRERELEASE" "$VERSION" "$GITHUB_RUN_NUMBER" \
            "$APK" "${{ steps.stage.outputs.sha256 }}" "$BASE_URL" \
            "$GITHUB_SHA" "$CHANNEL" > /tmp/release.json <<'PY'
          import json, os, sys
          tag, name, prerelease, ver, run, apk, sha, base_url, commit, channel = sys.argv[1:11]
          pre = prerelease == "true"
          hashes = ""
          if os.path.exists("/tmp/dsh-apks/hashes.md"):
              with open("/tmp/dsh-apks/hashes.md") as fh:
                  hashes = fh.read().strip()
          meta = (
              f"- versionName: `{ver}`\n"
              f"- versionCode: `{run}`\n"
              f"- DSH_BASE_URL: `{base_url}`\n"
              f"- commit: `{commit[:12]}`\n"
          )
          if hashes:
              meta += f"\n### Artifacts\n\n{hashes}\n"
          else:
              meta += f"- sha256: `{sha}`\n"
          changelog = ""
          if os.path.exists("/tmp/changelog.md"):
              with open("/tmp/changelog.md") as fh:
                  changelog = fh.read().strip()
          parts = []
          if channel == "dev":
              parts.append(
                  "Rolling dev channel — always the latest `master` build; "
                  "this artifact supersedes any earlier dev build."
              )
          if changelog:
              parts.append("## What's Changed\n\n" + changelog)
          parts.append(meta)
          body = "\n\n".join(parts)
          print(json.dumps({
              "tag_name": tag,
              "name": name,
              "body": body,
              "prerelease": pre,
              "target_commitish": commit,
          }))
          PY
          REL_ID=$(curl -sf -X POST "$API/releases" -H "$AUTH" \
            -H 'Content-Type: application/json' -d @/tmp/release.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          # The staging directory also holds hashes.md (the body's artifact
          # list); the glob names the upload set explicitly.
          for f in /tmp/dsh-apks/*.apk /tmp/dsh-apks/*.so /tmp/dsh-apks/*.sha256; do
            name=$(basename "$f")
            curl -sf -X POST "$API/releases/$REL_ID/assets?name=$name" -H "$AUTH" \
              -F "attachment=@$f" >/dev/null
          done
          echo "release $TAG created (id $REL_ID) with the per-ABI APKs"

      - name: Publish GitHub shadow Release (mirror)
        env:
          GH_PUB_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
          # The LAN egress proxy resets large request bodies (measured at
          # ~16 MB in on the old 139 MB universal-APK upload; the split
          # artifacts are well under that) while small JSON API calls sail
          # through — a mid-stream reset is the empty-shadow-release failure
          # this step's hard-fail exists to catch. GitHub is reachable
          # directly from the runner network, so this step runs proxy-less;
          # clearing every proxy variable beats fighting the NO_PROXY list the
          # job sets above.
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""
          ALL_PROXY: ""
          all_proxy: ""
          NO_PROXY: "*"
          no_proxy: "*"
        run: |
          set -u
          if [[ -z "$GH_PUB_TOKEN" ]]; then
            echo "::warning::GH_PUBLISH_TOKEN not set - skipping GitHub shadow release"
            exit 0
          fi
          APK="${{ steps.stage.outputs.apk }}"
          VERSION="${{ steps.ver.outputs.version }}"
          CHANNEL="${{ steps.ver.outputs.channel }}"
          API="https://api.github.com/repos/ChanceFlow/deepseek-harness-app"
          # Release-asset uploads live on a different host than the REST API;
          # POSTing an asset to api.github.com 404s, which is exactly the
          # failure that left every shadow release without its APK.
          UPLOADS="https://uploads.github.com/repos/ChanceFlow/deepseek-harness-app"
          AUTH="Authorization: token $GH_PUB_TOKEN"

          if [[ "$CHANNEL" == "release" ]]; then
            TAG="$GITHUB_REF_NAME"
            PRE=false
          else
            TAG="dev"
            PRE=true
            OLD_ID=$(curl -sf "$API/releases/tags/dev" -H "$AUTH" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' || true)
            [[ -n "${OLD_ID:-}" ]] && curl -sf -X DELETE "$API/releases/$OLD_ID" -H "$AUTH" >/dev/null || true
            curl -sf -X DELETE "$API/git/refs/tags/dev" -H "$AUTH" >/dev/null || true
          fi

          # Sanitized body (see header comment): version metadata + hash only.
          python3 - "$TAG" "deepseek-harness-app $VERSION" "$PRE" "$VERSION" "$GITHUB_RUN_NUMBER" \
            "$APK" "${{ steps.stage.outputs.sha256 }}" > /tmp/gh-release.json <<'PY'
          import json, os, sys
          tag, name, pre, ver, run, apk, sha = sys.argv[1:8]
          hashes = ""
          if os.path.exists("/tmp/dsh-apks/hashes.md"):
              with open("/tmp/dsh-apks/hashes.md") as fh:
                  hashes = fh.read().strip()
          meta = (
              f"- versionName: `{ver}`\n"
              f"- versionCode: `{run}`\n"
          )
          if hashes:
              meta += f"\n### Artifacts\n\n{hashes}\n"
          else:
              meta += f"- sha256: `{sha}`\n"
          intro = (
              "Rolling dev channel - always the latest `master` build; "
              "this artifact supersedes any earlier dev build.\n"
              if pre == "true" else
              "Stable release - changelog lives on the internal release "
              "channel; this mirror carries the artifact only.\n"
          )
          print(json.dumps({"tag_name": tag, "name": name, "body": intro + meta, "prerelease": pre == "true"}))
          PY

          REL_ID=$(curl -sf -X POST "$API/releases" -H "$AUTH" \
            -H 'Content-Type: application/json' -d @/tmp/gh-release.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])') || {
              echo "::warning::GitHub shadow release creation failed - Gitea release is already published"
              exit 0
            }
          for f in /tmp/dsh-apks/*.apk /tmp/dsh-apks/*.so /tmp/dsh-apks/*.sha256; do
            NAME=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$(basename "$f")")
            # Hard fail on an upload miss: the whole point of the shadow
            # release is the artifact, and a soft warning is exactly how the
            # endpoint bug shipped empty releases for days unnoticed.
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$UPLOADS/releases/$REL_ID/assets?name=$NAME" >/dev/null \
              || { echo "::error::GitHub asset upload failed for $f — release $REL_ID would publish without its artifact"; exit 1; }
          done
          echo "github shadow release $TAG created (id $REL_ID)"
