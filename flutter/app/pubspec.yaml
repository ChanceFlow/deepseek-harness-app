name: app
description: WebView shell for the DeepSeek Harness client.
publish_to: none
# versionName+versionCode. The release workflows override both with
# --build-name/--build-number; F-Droid's UpdateCheckData reads this line.
# versionCode = major*10000 + minor*100 + patch (bump it with each stable tag).
version: 0.3.3+303

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  domain: ^0.1.0
  network: ^0.1.0
  harness_adapter: ^0.1.0
  dev: ^0.1.0
  flutter_riverpod: ^3.4.2
  cronet_http: ^1.9.0
  http: ^1.5.0 # direct: di engine factory types http.Client (also via cronet_http/network)
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.0.0
  flutter_displaymode: ^0.7.0
  webview_flutter: ^4.14.1 # direct: the shell renders each host's web client in the system WebView
  webview_flutter_android: ^4.14.1 # direct: the page's mic/camera grant and the download listener
  webview_flutter_platform_interface: ^2.15.1 # direct: the permission resource types the page asks for

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3  # test-only: deterministic keep-alive timer timing

flutter:
  uses-material-design: true
  generate: true
