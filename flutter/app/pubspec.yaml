name: app
description: Flutter UI for the DeepSeek Harness client.
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  domain: ^0.1.0
  network: ^0.1.0
  harness_adapter: ^0.1.0
  dev: ^0.1.0
  asr: ^0.1.0
  flutter_riverpod: ^3.4.2
  image_picker: ^1.2.3
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  dartastic_opentelemetry: ^0.9.8  # test-only: in-memory OTel harness for telemetry instrumentation tests

flutter:
  uses-material-design: true
  generate: true
