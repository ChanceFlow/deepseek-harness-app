org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Compile Kotlin inside the Gradle daemon instead of forking a second JVM. The
# two-daemon profile (this one plus the Kotlin compile daemon, each sized by
# org.gradle.jvmargs) is what the CI container's memory budget cannot afford:
# the second JVM doubled the peak for a module this size.
kotlin.compiler.execution.strategy=in-process
# Emit task outputs to the build cache so a CI job reuses compilation results.
# The container image carries the snapshot its own warmup build produced; see
# .agents/notes/implemented/process/2026-09-11-container-ci-runner.md.
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
