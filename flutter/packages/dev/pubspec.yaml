name: dev
description: Debug-build tooling — ring log buffer, crash marker, restart detection, telemetry facade (log/event/metric), frame timing, OTLP export to SigNoz. Compiled in on debug builds only.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  dartastic_opentelemetry: ^0.9.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0

flutter:
  uses-material-design: false